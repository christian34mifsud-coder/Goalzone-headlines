<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goalzone Headlines — All Links</title>
<meta name="description" content="Goalzone Headlines: football, youth talent and events in Malta. All our channels in one place.">
<meta property="og:title" content="Goalzone Headlines — All Links">
<meta property="og:description" content="Football · Youth Talent · Events · Malta">
<meta property="og:image" content="assets/movement-school-sponsor.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0b0b0c;
    --panel: #16161a;
    --gold: #d9b45a;
    --gold-hi: #f3d98b;
    --red: #c8102e;
    --white: #f6f4ef;
    --muted: #9a968c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at top, rgba(217,180,90,.18), transparent 60%),
      linear-gradient(180deg, #111 0%, var(--black) 100%);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 36px 16px 48px;
  }
  main { width: 100%; max-width: 480px; }

  header { text-align: center; margin-bottom: 28px; }
  .crest {
    width: 84px; height: 84px; margin: 0 auto 14px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 60%, #8a6b24);
    box-shadow: 0 0 0 3px var(--black), 0 0 0 5px var(--gold), 0 10px 30px rgba(217,180,90,.35);
    font-size: 40px;
  }
  h1 {
    font-family: "Anton", Impact, sans-serif;
    font-size: 40px; letter-spacing: 1px; line-height: 1;
    text-transform: uppercase;
  }
  h1 span {
    display: inline-block; background: var(--red); color: var(--white);
    padding: 2px 10px 4px; transform: skew(-8deg); margin-left: 4px;
  }
  .tagline {
    margin-top: 12px; font-size: 12px; font-weight: 600;
    letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
  }
  .flag { display: inline-block; width: 18px; height: 12px; vertical-align: -1px; margin-left: 4px;
    background: linear-gradient(90deg, #fff 50%, var(--red) 50%); border-radius: 2px; }

  .section-label {
    font-family: "Anton", Impact, sans-serif;
    font-size: 15px; letter-spacing: 2px; color: var(--gold);
    text-transform: uppercase; margin: 26px 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }

  .links { display: flex; flex-direction: column; gap: 10px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid #2a2a30;
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    color: var(--white); text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: var(--gold); background: #1d1d22; outline: none; }
  .link .icon {
    width: 38px; height: 38px; flex: none; border-radius: 8px;
    display: grid; place-items: center; font-size: 13px; font-weight: 800;
    color: #fff;
  }
  .link .text { flex: 1; min-width: 0; }
  .link .title { font-weight: 800; font-size: 15px; }
  .link .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .link .arrow { color: var(--gold); font-size: 18px; }
  .link.soon { opacity: .45; pointer-events: none; border-left-color: #444; }
  .link.soon .arrow { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .link.featured { border-left-color: var(--red); background: linear-gradient(90deg, rgba(200,16,46,.22), var(--panel) 60%); }

  .yt { background: #ff0000; } .fb { background: #1877f2; } .tt { background: #000; border: 1px solid #333; }
  .ig { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); } .li { background: #0a66c2; }
  .wa { background: #25d366; } .web { background: var(--gold); color: var(--black) !important; }
  .pod { background: #6b2fd6; } .myt { background: var(--red); }

  .news {
    margin-top: 10px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--gold); display: block;
  }
  .news img { width: 100%; display: block; }
  .news-cap { padding: 10px 14px; font-size: 13px; background: var(--panel); }
  .news-cap b { color: var(--gold); }

  footer { text-align: center; margin-top: 34px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="crest" aria-hidden="true">⚽</div>
    <h1>Goalzone<span>Headlines</span></h1>
    <p class="tagline">Football · Youth Talent · Events · Malta <i class="flag" aria-hidden="true"></i></p>
  </header>

  <div class="section-label">Latest news</div>
  <a class="news" href="assets/movement-school-sponsor.jpg">
    <img src="assets/movement-school-sponsor.jpg" alt="The Movement School Malta announced as Main Sponsor of the Goalzone Headlines Mqabba U10 Football Festival" loading="lazy">
    <div class="news-cap"><b>Main Sponsor:</b> The Movement School Malta × Goalzone Headlines Mqabba U10 Football Festival</div>
  </a>

  <div id="groups"></div>

  <footer>© Goalzone Headlines · Malta</footer>
</main>

<script>
  // ✏️ EDIT YOUR LINKS HERE — leave url as "" to show "Coming soon"
  const GROUPS = [
    { label: "Get in touch", links: [
      { title: "WhatsApp us", sub: "Media packages · Designs · Festival entries", url: "https://wa.me/35679223337", icon: "WA", cls: "wa", featured: true },
      { title: "Website", sub: "goalzoneheadlines.com", url: "https://goalzoneheadlines.com", icon: "WEB", cls: "web" },
    ]},
    { label: "Goalzone Headlines", links: [
      { title: "YouTube", sub: "@Goalzoneheadlines", url: "https://www.youtube.com/@Goalzoneheadlines", icon: "YT", cls: "yt" },
      { title: "Facebook", sub: "Goalzone Headlines page", url: "", icon: "FB", cls: "fb" },
      { title: "Instagram", sub: "@33chrismifsud", url: "https://www.instagram.com/33chrismifsud", icon: "IG", cls: "ig" },
      { title: "LinkedIn", sub: "Christian Mifsud", url: "", icon: "in", cls: "li" },
    ]},
    { label: "Maltese Young Talent", links: [
      { title: "TikTok", sub: "@malteseyoungtalents", url: "https://www.tiktok.com/@malteseyoungtalents", icon: "TT", cls: "tt" },
      { title: "Facebook", sub: "Maltese Young Talent page", url: "", icon: "MYT", cls: "myt" },
    ]},
    { label: "More from us", links: [
      { title: "Duo Football Podcast", sub: "Facebook page", url: "https://www.facebook.com/658913167298082", icon: "POD", cls: "pod" },
      { title: "Maltese Headlines", sub: "Facebook page", url: "", icon: "FB", cls: "fb" },
    ]},
  ];

  const root = document.getElementById("groups");
  for (const g of GROUPS) {
    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = g.label;
    const list = document.createElement("div");
    list.className = "links";
    for (const l of g.links) {
      const a = document.createElement("a");
      a.className = "link" + (l.url ? "" : " soon") + (l.featured ? " featured" : "");
      if (l.url) { a.href = l.url; a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = `<span class="icon ${l.cls}"></span><span class="text"><div class="title"></div><div class="sub"></div></span><span class="arrow"></span>`;
      a.querySelector(".icon").textContent = l.icon;
      a.querySelector(".title").textContent = l.title;
      a.querySelector(".sub").textContent = l.sub;
      a.querySelector(".arrow").textContent = l.url ? "→" : "SOON";
      list.appendChild(a);
    }
    root.append(label, list);
  }
</script>
</body>
</html>
